<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Sync - Notas Offline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="description" content="Tus notas - Funciona offline">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%236366f1' rx='20' width='100' height='100'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle' fill='white' font-family='sans-serif'%3EN%3C/text%3E%3C/svg%3E">
</head>
<body>
    <div id="app" class="app">
        <div class="bg-gradient"></div>
        <div class="bg-grid"></div>
        
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="url(#logoGrad)" opacity="0.3"/>
                            <path d="M8 2v4M16 2v4M4 10h16" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round"/>
                            <defs>
                                <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#818cf8"/>
                                    <stop offset="100%" stop-color="#6366f1"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <span class="logo-text">Notes</span>
                    <span class="logo-accent">Offline</span>
                </div>
                <button class="btn-icon sidebar-toggle" id="sidebarToggle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
            </div>

            <!-- Quick Actions -->
            <div class="quick-actions">
                <button class="btn-new-note" id="newNoteBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Nueva Nota
                </button>
                
                <div class="upload-zone" id="uploadZone">
                    <input type="file" id="fileInput" accept=".txt,.md,.pdf,.json" multiple hidden>
                    <button class="btn-upload" onclick="document.getElementById('fileInput').click()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        Importar
                    </button>
                </div>

                <button class="btn-export" id="exportBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Exportar Todo
                </button>
            </div>

            <div class="sidebar-section">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Buscar notas..." class="search-input">
                </div>
            </div>

            <div class="sidebar-section">
                <h3 class="sidebar-title">Materias</h3>
                <ul class="subject-list" id="subjectList">
                    <li class="subject-item active" data-subject="all">
                        <span class="subject-dot"></span>
                        <span class="subject-name">Todas</span>
                        <span class="subject-count" id="totalCount">0</span>
                    </li>
                </ul>
            </div>

            <div class="sidebar-section">
                <h3 class="sidebar-title">Archivos</h3>
                <ul class="files-list" id="filesList"></ul>
            </div>

            <div class="sidebar-footer">
                <div class="sync-status" id="syncStatus">
                    <div class="sync-indicator"></div>
                    <span class="sync-text">Modo Local</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="notes-view" id="notesView">
                <div class="notes-header">
                    <div class="header-left">
                        <h1 class="notes-title">Mis Notas</h1>
                        <span class="notes-count" id="notesCount">0 notas</span>
                    </div>
                    <div class="notes-sort">
                        <select id="sortSelect" class="sort-select">
                            <option value="modifiedAt">Más recientes</option>
                            <option value="createdAt">Fecha creación</option>
                            <option value="title">Título A-Z</option>
                            <option value="subject">Materia</option>
                        </select>
                    </div>
                </div>

                <div class="notes-grid" id="notesGrid"></div>

                <div class="empty-state" id="emptyState">
                    <div class="empty-illustration">
                        <svg viewBox="0 0 120 120" fill="none">
                            <rect x="20" y="30" width="80" height="70" rx="8" stroke="url(#emptyGrad)" stroke-width="2" opacity="0.3"/>
                            <circle cx="85" cy="85" r="20" fill="url(#emptyGrad)" opacity="0.1"/>
                            <path d="M80 85l5 5 10-10" stroke="url(#emptyGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <defs>
                                <linearGradient id="emptyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#818cf8"/>
                                    <stop offset="100%" stop-color="#6366f1"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <h2 class="empty-title">No hay notas todavía</h2>
                    <p class="empty-text">Crea tu primera nota o importa un archivo</p>
                </div>

                <div class="loading-state" id="loadingState">
                    <div class="loading-spinner"></div>
                    <p>Cargando...</p>
                </div>
            </div>

            <!-- Note Editor -->
            <div class="editor-view hidden" id="editorView">
                <div class="editor-header">
                    <button class="btn-back" id="backBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="19" y1="12" x2="5" y2="12"/>
                            <polyline points="12 19 5 12 12 5"/>
                        </svg>
                        Volver
                    </button>
                    <div class="editor-actions">
                        <button class="btn-save" id="saveNoteBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                                <polyline points="17 21 17 13 7 13 7 21"/>
                            </svg>
                            Guardar
                        </button>
                        <span class="save-status" id="saveStatus"></span>
                        <button class="btn-delete" id="deleteNoteBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"/>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="editor-content">
                    <input type="text" id="noteTitle" class="note-title-input" placeholder="Título de la nota">
                    <div class="note-meta">
                        <div class="meta-field">
                            <label for="noteSubject">Materia</label>
                            <input type="text" id="noteSubject" placeholder="Ej: Física" list="subjectsList">
                            <datalist id="subjectsList"></datalist>
                        </div>
                        <div class="meta-field">
                            <label for="noteTags">Etiquetas</label>
                            <input type="text" id="noteTags" placeholder="Separadas por coma">
                        </div>
                    </div>
                    <div class="content-area">
                        <textarea id="noteContent" placeholder="Escribe tus notas aquí..."></textarea>
                    </div>
                    <div class="editor-footer">
                        <div class="word-stats">
                            <span id="wordCount">0 palabras</span>
                            <span class="separator">•</span>
                            <span id="charCount">0 caracteres</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Delete Modal -->
    <div class="modal-overlay hidden" id="deleteModal">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h2 class="modal-title">Eliminar Nota</h2>
                <button class="btn-icon modal-close" id="closeDeleteModal">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body"><p>¿Eliminar esta nota permanentemente?</p></div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelDeleteBtn">Cancelar</button>
                <button class="btn-danger" id="confirmDeleteBtn">Eliminar</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="app.js"></script>
</body>
</html>
